# Unit tests for the pure parts of the updater and the ingest chunking.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/chunking.py"
      - "updater/**"
      - "tests/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: updater/requirements.txt
      - run: pip install -r updater/requirements.txt pytest
      - run: pytest -q tests
