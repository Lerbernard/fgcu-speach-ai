# When data/ changes on main (a merged data-update PR, or a manual edit),
# push only the changed files into Pinecone and record what was ingested.
# The live index is only ever updated from main, never from a PR branch.
#
# Secrets: PINECONE_API_KEY, PINECONE_INDEX_NAME (optional PINECONE_NAMESPACE).
name: Ingest changed data into Pinecone

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "backend/chunking.py"
      - "backend/ingest_incremental.py"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-upload every file (no index wipe)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "pinecone==7.3.0" python-dotenv

      - name: Incremental ingest
        working-directory: backend
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_NAMESPACE: ${{ secrets.PINECONE_NAMESPACE }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            python ingest_incremental.py --full
          else
            python ingest_incremental.py
          fi

      - name: Record what was ingested
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/ingest_state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record incremental ingest state [skip ci]"
          git push
