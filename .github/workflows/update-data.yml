# Daily data refresh: re-scrape the FGCU pages behind data/, and when anything
# changed, open (or update) a pull request with the diff and a report. Nothing
# reaches main or Pinecone until that PR is merged; ingest.yml takes it from there.
#
# One-time repo setting: Settings -> Actions -> General -> Workflow permissions:
# "Read and write" + "Allow GitHub Actions to create and approve pull requests".
name: Update data from FGCU

on:
  schedule:
    - cron: "0 10 * * *"        # 06:00 America/New_York (10:00 UTC)
  workflow_dispatch:
    inputs:
      only:
        description: "Sources to run (space-separated: pages faculty courses descriptions events calendar); empty = all"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: updater/requirements.txt

      - run: pip install -r updater/requirements.txt

      - name: Run updater
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            python updater/update.py --report updater/last_report.md --only $ONLY
          else
            python updater/update.py --report updater/last_report.md
          fi

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/data-update
          base: main
          title: "data: automatic update from FGCU pages"
          commit-message: "data: automatic update from FGCU pages"
          body-path: updater/last_report.md
          add-paths: |
            data/**
            updater/state.json
            updater/last_report.md
          labels: data-update
          delete-branch: true
